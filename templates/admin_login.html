{% extends "base.html" %}{% block content %}
<main class="auth card"><div class="tag">ADMIN ACCESS</div><h1>Admin Login</h1>
<p>Track students, monitor interview activity, and create new practice tests.</p>
<form method="post"><label>Email</label><input type="email" name="email" placeholder="Admin email" required><label>Password</label><input type="password" name="password" placeholder="Admin password" required><button>Login as Admin</button></form>
