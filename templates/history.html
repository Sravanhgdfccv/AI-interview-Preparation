{% extends "base.html" %}{% block content %}<main class="dashboard"><div class="tag">YOUR RECORDS</div><h1>Interview History</h1><div class="card table"><table><tr><th>Role</th><th>Type</th><th>Difficulty</th><th>Score</th><th>Date</th></tr>{% for r in rows %}<tr><td>{{r.job_role}}</td><td>{{r.interview_type}}</td><td>{{r.difficulty}}</td><td>{{"%.1f"|format(r.score)}}/10</td><td>{{r.created_at}}</td></tr>{% else %}<tr><td colspan="5">No completed interviews yet.</td></tr>{% endfor %}</table></div></main>{% endblock %}
